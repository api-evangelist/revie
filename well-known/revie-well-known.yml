note: >-
  NO HIT. Every /.well-known/ path probed on every Revie host returned 404 or 403.
  revie.lat and revie.ai are Webflow-hosted marketing sites and answer every
  /.well-known/* request with an 88-byte HTML body reading "Invalid .well-known
  request" — an HTML shell, not a document. app.revie.lat is a create-react-app SPA
  whose catch-all returns the index.html shell with a 404 status. api.revie.lat is an
  AWS API Gateway that answers every unmatched path, including /.well-known/*, with
  403 {"message":"Missing Authentication Token"}. help.revie.ai is a Crisp-hosted help
  centre that 404s every path. Because no path returned a real document, NO WellKnown
  or SecurityTxt pointer is emitted in apis.yml — this file records an absence, and an
  absence must not be scored as a presence.

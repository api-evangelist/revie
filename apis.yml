name: Revie
description: Revie is an AI-powered customer review collection and WhatsApp marketing
  automation platform for e-commerce businesses, with a focus on the Latin American
  market. It requests and collects product reviews over WhatsApp (in text, photo,
  video, and voice-note formats) after a purchase, then applies AI sentiment analysis
  and keyword grouping to surface customer feedback in a dashboard. Revie also powers
  WhatsApp marketing campaigns, customer segmentation, and discount incentives, and
  integrates with Shopify, Tienda Nube, and VTEX storefronts. The company exposes no
  public developer API or SDK; its product is delivered as installable storefront apps.

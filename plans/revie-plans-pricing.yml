note: >-
  Revie publishes product pricing but no API pricing — there is no public developer
  API, so none of these tiers grant or meter API access. Two distinct published price
  ladders exist and both are recorded verbatim: the storefront-app ladder shown on the
  Shopify listing and the /planes page (Lite / Pro / Plus, priced per month plus a
  per-review-request and per-country WhatsApp message cost), and an order-volume ladder
  also shown on /planes and en.revie.ai (Plan 1000 / Plan 2000 / custom enterprise,
  priced by monthly order count). Revie does not reconcile the two ladders on its own
  pages, so they are not merged here. Per-message pricing is country-dependent and
  Revie exposes a calculator rather than a published rate card, so message rates are
  recorded only where a figure is actually printed.
